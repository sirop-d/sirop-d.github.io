<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>404 — sirop</title>
<meta name="description" content="このページは見つからない。レモネードを一杯、どう？">
<link rel="canonical" href="https://sirop.jp/404.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Shippori+Mincho:wght@400;500&family=Zen+Kaku+Gothic+New:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fff;
    --ink:#1C3A5B;
    --ink-strong:#15293F;
    --ink-soft:#48607F;
    --ink-faint:#8C93A0;
    --line:rgba(28,58,91,.16);
    --sans-ja:"Zen Kaku Gothic New",system-ui,sans-serif;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink)}
  body{
    font-family:var(--sans-ja);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:48px 24px;
  }
  .code{
    margin:0 0 8px;font-family:"Cormorant Garamond",serif;
    font-size:clamp(42px,8vw,72px);letter-spacing:.18em;color:var(--ink-faint);font-weight:400;
  }
  figure{margin:0 0 28px;width:min(280px,58vw)}
  figure img{display:block;width:100%;height:auto}
  h1{
    margin:0;font-family:"Shippori Mincho",serif;font-weight:500;
    font-size:clamp(22px,4.2vw,34px);line-height:1.45;color:var(--ink-strong);letter-spacing:.04em;
  }
  .lead{
    margin:14px 0 0;max-width:32ch;font-family:"Shippori Mincho",serif;
    font-size:15px;line-height:1.9;color:var(--ink-soft);
    display:flex;flex-direction:column;align-items:center;gap:0;
  }
  .lead-line{display:block;white-space:nowrap}
  @media(max-width:360px){
    .lead{max-width:18ch}
    .lead-line{white-space:normal}
  }
  .note{
    margin:10px 0 0;max-width:36ch;font-size:12px;line-height:1.8;
    letter-spacing:.06em;color:var(--ink-faint);
  }
  .actions{margin-top:36px;display:flex;flex-wrap:wrap;gap:14px 28px;justify-content:center}
  a.link{
    position:relative;
    font-size:12px;letter-spacing:.14em;color:var(--ink-strong);text-decoration:none;
    border-bottom:1px solid var(--line);padding-bottom:4px;
  }
  a.link.quiet{color:var(--ink-soft)}
  a.link:hover{border-color:var(--ink-strong)}
  /* sirop.jp [data-site-tip] と同系 */
  [data-site-tip]{position:relative}
  [data-site-tip]::before{
    content:attr(data-tip);position:absolute;top:calc(100% + 9px);left:50%;
    transform:translate(-50%,-4px);padding:6px 11px;border-radius:999px;
    border:1px solid rgba(21,41,63,.3);background:rgba(255,255,255,.9);color:#15293F;
    font:500 11px/1.35 var(--sans-ja);letter-spacing:.04em;white-space:nowrap;
    opacity:0;pointer-events:none;z-index:120;
    transition:opacity .16s var(--ease),transform .16s var(--ease);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  }
  [data-site-tip]:hover::before,[data-site-tip]:focus-visible::before{opacity:1;transform:translate(-50%,0)}
  @media(hover:none){[data-site-tip]::before{display:none}}
</style>
</head>
<body>
  <p class="code" aria-hidden="true">404</p>
  <figure>
    <img src="https://sirop.jp/assets/journal/kitt-drops-lemonade.png" width="1024" height="1024" alt="Kitt — レモネードを差し出すレモン少女">
  </figure>
  <h1>このページは見つからない</h1>
  <p class="lead">
    <span class="lead-line">迷子のところへ、</span>
    <span class="lead-line">レモネードを一杯。</span>
  </p>
  <p class="note">sirop-d.github.io は入口の控え。本館は sirop.jp です。</p>
  <div class="actions">
    <a class="link" href="https://sirop.jp/" data-site-tip data-tip="開く: sirop.jp へ">sirop.jp へ</a>
    <a class="link quiet" href="https://sirop.jp/journal-kitt.html" data-site-tip data-tip="開く: Kitt の話を読む">Kitt の話を読む</a>
  </div>
</body>
</html>
